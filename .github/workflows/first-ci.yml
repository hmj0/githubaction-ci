name: rappel
run-name: rappel avec ${{github.repository}}

on: 
    push: 
        branches: main
    pull_request: 
        branches: main
    workflow_dispatch:
        inputs:
            environnements:
                description: les types d'env disponible
                required: true
                type: choice
                options:
                    - dev
                    - prod
                    - staging

permissions:
    contents: read

env:

    USER_NAME: ${{secrets.USER_NAME}}
    USER_PASSWORD: ${{secrets.USER_PASSWORD}}

jobs:
    test:
        if: github.event_name == 'push' || github.event.inputs == 'dev'
        name: job_rappel
        runs-on: ubuntu-22.04
        timeout-minutes: 5
        env:
            REPOSITORY: ${{github.repository}}
            ACTOR: ${{github.actor}}
            EVENT_NAME: ${{github.event_name}}
            

        steps:
            - name: checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - name: Context github
              run: |
                 
                   echo "repository: $REPOSITORY "
                   echo "actor: $ACTOR"
                   echo "Event name : $EVENT_NAME"
            
            - name: user name
              run: |
                 
                  echo "User name : $USER_NAME"
                  echo "User Password: $USER_PASSWORD"

            - name: Info sur le workflow dispatch
              run: |
                   echo "Options choisis: ${{inputs.environnements}}"

                   echo "Options choisis: ${{github.event.inputs}}"
